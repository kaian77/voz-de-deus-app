project_id = "voz-de-deus-app"

# Funções chamadas por serviços externos (Meta, TikTok, Nuvemshop, pg_cron, Claude) não usam o JWT do Supabase:
# cada uma faz a própria autenticação (assinatura do webhook, state assinado, CRON_SECRET, chave de API).

[functions.instagram-webhook]
verify_jwt = false

[functions.oauth-instagram]
verify_jwt = false

[functions.oauth-tiktok]
verify_jwt = false

[functions.oauth-nuvemshop]
verify_jwt = false

[functions.publish-scheduled]
verify_jwt = false

[functions.agent]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.ai]
verify_jwt = true

[functions.inbox]
verify_jwt = true

[functions.oauth-mercadolivre]
verify_jwt = false

[functions.oauth-shopee]
verify_jwt = false

# Formulário público de avaliação (valida o pedido + e-mail na Nuvemshop)
[functions.reviews]
verify_jwt = false

[functions.oauth-youtube]
verify_jwt = false

# Avisos de pagamento do Mercado Pago (PáginasPro); o pagamento é conferido na API do Mercado Pago
[functions.mercadopago-webhook]
verify_jwt = false
