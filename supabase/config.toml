# Funções chamadas por serviços externos (Meta, TikTok, pg_cron, Claude) não usam o JWT do Supabase:
# cada uma faz a própria autenticação (assinatura do webhook, state assinado, CRON_SECRET, chave de API).

[functions.instagram-webhook]
verify_jwt = false

[functions.oauth-instagram]
verify_jwt = false

[functions.oauth-tiktok]
verify_jwt = false

[functions.publish-scheduled]
verify_jwt = false

[functions.agent]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.ai]
verify_jwt = true

[functions.inbox]
verify_jwt = true
