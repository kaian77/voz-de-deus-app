# Instala/atualiza o backend do Studio no Supabase (tabelas, funções, secrets, agendador).
# Precisa do secret SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions).
# As chaves dos apps (IG_APP_ID, IG_APP_SECRET, ANTHROPIC_API_KEY...) também vêm de secrets do repositório.
name: Supabase deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/supabase-deploy.sh"
      - ".github/workflows/supabase-deploy.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      APP_URL: ${{ vars.APP_URL || 'https://voz-de-deus-app.vercel.app' }}
      # Token de verificação dos webhooks da Meta (não é segredo: os eventos são assinados com o app secret)
      META_VERIFY_TOKEN: ${{ vars.META_VERIFY_TOKEN || 'voz-de-deus-studio' }}
      # "true" libera novos cadastros no Studio; por padrão só quem já tem conta entra
      ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP }}
      # Chaves opcionais dos apps — crie como secrets do repositório quando tiver
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      NUVEMSHOP_APP_ID: ${{ secrets.NUVEMSHOP_APP_ID }}
      NUVEMSHOP_CLIENT_SECRET: ${{ secrets.NUVEMSHOP_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Client ID do app do Mercado Livre (público); o secret ML_APP_ID, se existir, tem prioridade
      ML_APP_ID: ${{ secrets.ML_APP_ID || '5226202533888505' }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      SHOPEE_PARTNER_ID: ${{ secrets.SHOPEE_PARTNER_ID }}
      SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
      # Token do GitHub (fine-grained, só este repositório, Actions: read and write) para o vídeo começar na hora
      VIDEO_DISPATCH_TOKEN: ${{ secrets.VIDEO_DISPATCH_TOKEN }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      META_FB_ACCESS_TOKEN: ${{ secrets.META_FB_ACCESS_TOKEN }}
      META_FB_IG_USER_ID: ${{ secrets.META_FB_IG_USER_ID }}
      # Vídeos IA: chaves do Kling (API oficial) e do Higgsfield
      KLING_ACCESS_KEY: ${{ secrets.KLING_ACCESS_KEY }}
      KLING_SECRET_KEY: ${{ secrets.KLING_SECRET_KEY }}
      KLING_API_BASE: ${{ vars.KLING_API_BASE }}
      HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
      HIGGSFIELD_API_SECRET: ${{ secrets.HIGGSFIELD_API_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REVIEW_EMAIL_FROM: ${{ vars.REVIEW_EMAIL_FROM }}
      # Domínio próprio das landing pages: token da Vercel (Account Settings → Tokens); projeto e time são opcionais
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      # WhatsApp da PáginasPro (app + API juntos, botão "Conectar com Facebook"): id do app da Meta e da configuração
      # do Login do Facebook para Empresas (públicos, podem ser variáveis) e o segredo do app (se for diferente do WHATSAPP_APP_SECRET)
      META_APP_ID: ${{ vars.META_APP_ID || secrets.META_APP_ID }}
      WA_ES_CONFIG_ID: ${{ vars.WA_ES_CONFIG_ID || secrets.WA_ES_CONFIG_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      # PáginasPro: pagou → publica (Mercado Pago → Suas integrações → Credenciais de produção → Access Token)
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: ./scripts/supabase-deploy.sh
