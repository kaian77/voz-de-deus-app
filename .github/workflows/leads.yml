# Leads do Google Maps (Renda Extra): processa a fila de buscas do Studio (tabela lead_searches; e manual_searches de Maps/Etsy, video/manual_leads.py) com o robô
# open source gosom/google-maps-scraper. O Studio dispara este workflow ao criar uma busca (secret
# VIDEO_DISPATCH_TOKEN); o horário abaixo é a rede de segurança. Com a fila vazia, termina em segundos.
name: Leads do Google Maps

on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Tentar de novo as buscas que falharam ou vieram incompletas"
        type: boolean
        default: false

# Uma busca de cada vez (nunca buscas em paralelo contra o Google); a da vez não é cancelada
concurrency:
  group: leads
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      # Leads da Montagem 3D no Etsy (opcional): "keystring:shared secret" do app em etsy.com/developers
      ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem busca na fila?
        id: queue
        run: echo "status=$(cd video && python3 leads.py --check ${{ inputs.retry_failed && '--retry-failed' || '' }})" >> "$GITHUB_OUTPUT"

      - name: Robô do Google Maps
        if: steps.queue.outputs.status == 'queued'
        run: docker run -d --name gmaps -v gmapsdata:/gmapsdata -p 127.0.0.1:8080:8080 gosom/google-maps-scraper:v1.18.1 -web -data-folder /gmapsdata

      - name: Buscar leads
        if: steps.queue.outputs.status == 'queued'
        run: cd video && python3 leads.py

      - name: Móveis com manual ruim (Maps e Etsy)
        if: steps.queue.outputs.status == 'queued'
        run: cd video && python3 manual_leads.py

      - name: Log do robô (se falhar)
        if: failure() && steps.queue.outputs.status == 'queued'
        run: docker logs --tail 200 gmaps
