# Vídeos dos produtos (Reels/TikTok): renderiza a fila do Studio (tabela product_videos).
# O Studio dispara este workflow na hora em que um vídeo entra na fila (secret VIDEO_DISPATCH_TOKEN); o horário
# abaixo é só a rede de segurança, 3 vezes por dia, para economizar os minutos grátis do GitHub Actions.
# Com a fila vazia, termina em segundos (sem instalar nada). Usa o mesmo secret SUPABASE_ACCESS_TOKEN do deploy.
name: Vídeos dos produtos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12,17,22 * * *" # 9h17, 14h17 e 19h17 (Brasília)

concurrency:
  group: product-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem vídeo na fila?
        id: queue
        run: echo "status=$(python3 video/worker.py --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.status == 'queued'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt

      - name: Dependências
        if: steps.queue.outputs.status == 'queued'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r video/requirements.txt

      - name: Modelo de recorte (cache)
        if: steps.queue.outputs.status == 'queued'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1

      - name: Renderizar
        if: steps.queue.outputs.status == 'queued'
        run: python3 video/worker.py
