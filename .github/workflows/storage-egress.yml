name: Banda do storage (egress)

# Mostra o que mais gastou banda do storage nas últimas 24 h (limite dos logs no plano grátis):
# arquivos mais baixados, por pasta e por quem baixou (navegador, Instagram, workflows...).
# Só lê os logs pela API de gerenciamento do Supabase (endpoint `logs`, SQL do ClickHouse); não muda nada.
on:
  workflow_dispatch:

jobs:
  egress:
    runs-on: ubuntu-latest
    env:
      REF: rrlxhnmfsmknzhqpfrhr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Ler os logs do storage
        run: |
          set -euo pipefail
          START=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() {
            sleep 4  # a API limita várias consultas seguidas
            curl -sS -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
              --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END"
          }
          show() { jq -r --arg k "$1" '(.error // .message // empty), (.result[]? | "\(.mb)\t\(.hits)\t\(.[$k])")'; }
          A="log_attributes"
          BYTES="round(sum(toInt64OrZero($A['response.headers.content_length'])) / 1048576, 1)"
          WHERE="from logs where source_name = 'edge_logs'
            and $A['request.path'] like '/storage/v1/object/%' and $A['request.method'] = 'GET'"
          echo "== Campos de uma linha (conferência) =="
          q "select mapKeys($A) as k $WHERE limit 1" | head -c 3000; echo
          echo
          echo "== Total (MB) e cache =="
          q "select $A['response.headers.cf_cache_status'] as cache, count() as hits, $BYTES as mb $WHERE
             group by cache order by mb desc" | show cache
          echo
          echo "== Por pasta (MB) =="
          q "select extract($A['request.path'], '/public/media/[^/]+/([^/]+)') as pasta, count() as hits, $BYTES as mb $WHERE
             group by pasta order by mb desc limit 30" | show pasta
          echo
          echo "== Por quem baixou (MB) =="
          q "select $A['request.headers.user_agent'] as ua, count() as hits, $BYTES as mb $WHERE
             group by ua order by mb desc limit 25" | show ua
          echo
          echo "== Arquivos que mais gastaram (MB, downloads) =="
          q "select $A['request.path'] as path, count() as hits, $BYTES as mb $WHERE
             group by path order by mb desc limit 60" | show path
