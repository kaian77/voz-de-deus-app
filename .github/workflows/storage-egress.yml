name: Banda do storage (egress)

# Mostra o que mais gastou banda do storage nas últimas 24 h (limite dos logs no plano grátis):
# arquivos mais baixados, por pasta e por quem baixou (navegador, Instagram, workflows...).
# Só lê os logs pela API de gerenciamento do Supabase; não muda nada.
on:
  workflow_dispatch:

jobs:
  egress:
    runs-on: ubuntu-latest
    env:
      REF: rrlxhnmfsmknzhqpfrhr
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Ler os logs do storage
        run: |
          set -euo pipefail
          START=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() {
            curl -sS -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
              --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END"
          }
          BASE="from edge_logs
            cross join unnest(metadata) as m
            cross join unnest(m.request) as req
            cross join unnest(m.response) as res
            cross join unnest(res.headers) as rh
            cross join unnest(req.headers) as qh
            where req.path like '/storage/v1/object/%' and req.method = 'GET'"
          echo "== Aviso do Supabase sobre o endpoint novo =="
          curl -sSL "https://supabase.com/changelog/48235-migration-of-supabase-management-api-logs-all-analytics-endpoint-to-logs-endpoint" \
            | sed -e 's/<[^>]*>/\n/g' | grep -v '^\s*$' | grep -iE 'sql|table|source|logs|query|select|from |field|column|edge|storage' | head -80 || true
          for t in logs edge_logs storage_logs "edge_logs_v2" "logs.edge" ; do
            echo "-- tabela $t:"; q "select * from $t limit 1" | head -c 600; echo
          done
          echo "== Conferência (resposta crua) =="
          q "select count(*) as n from edge_logs cross join unnest(metadata) as m cross join unnest(m.request) as req
             where req.path like '/storage/v1/object/%'" | head -c 1500; echo
          q "select id, timestamp, event_message, metadata from edge_logs cross join unnest(metadata) as m cross join unnest(m.request) as req
             where req.path like '/storage/v1/object/public/%' limit 1" | head -c 4000; echo
          echo "== Arquivos que mais gastaram (MB, downloads) =="
          q "select req.path as path, count(*) as hits, round(sum(safe_cast(rh.content_length as int64)) / 1048576, 1) as mb $BASE
             group by path order by mb desc limit 60" | tee files.json \
            | jq -r '.result[]? | "\(.mb)\t\(.hits)\t\(.path)"' || true
          jq -r '.error? // empty' files.json
          echo
          echo "== Por quem baixou (MB) =="
          q "select coalesce(qh.user_agent, '?') as ua, count(*) as hits, round(sum(safe_cast(rh.content_length as int64)) / 1048576, 1) as mb $BASE
             group by ua order by mb desc limit 25" \
            | jq -r '.result[]? | "\(.mb)\t\(.hits)\t\(.ua)"' || true
          echo
          echo "== Por pasta (MB) =="
          q "select regexp_extract(req.path, r'/public/media/[^/]+/([^/]+)') as pasta, count(*) as hits,
               round(sum(safe_cast(rh.content_length as int64)) / 1048576, 1) as mb $BASE
             group by pasta order by mb desc limit 30" \
            | jq -r '.result[]? | "\(.mb)\t\(.hits)\t\(.pasta)"' || true
          echo
          echo "== Total (MB) e cache =="
          q "select coalesce(rh.cf_cache_status, '?') as cache, count(*) as hits,
               round(sum(safe_cast(rh.content_length as int64)) / 1048576, 1) as mb $BASE group by cache order by mb desc" \
            | jq -r '.result[]? | "\(.mb)\t\(.hits)\t\(.cache)"' || true
