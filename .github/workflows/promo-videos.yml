# Renderiza os 28 vídeos-tutorial da promoção R$14,99 (video/promo_tutorial.py), sobe no storage e agenda
# cada um como Reels + Story no Instagram, 3 por dia (video/promo_post.py). Rodar de novo não duplica.
name: Vídeos da promoção R$14,99

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
          pip install -q pillow numpy
      - name: Renderizar
        run: |
          mkdir -p raw out
          for g in "0 4 8 12 16 20 24" "1 5 9 13 17 21 25" "2 6 10 14 18 22 26" "3 7 11 15 19 23 27"; do
            python3 video/promo_tutorial.py raw $g &
          done
          wait
          ls raw/*.mp4 | wc -l
      - name: Comprimir e nivelar o som
        run: |
          for f in raw/*.mp4; do
            ffmpeg -v error -y -i "$f" -c:v libx264 -preset medium -crf 23 -maxrate 3500k -bufsize 7M -pix_fmt yuv420p \
              -af loudnorm=I=-15:TP=-1.5:LRA=11 -c:a aac -b:a 128k -movflags +faststart "out/$(basename "$f")"
          done
          du -sh out
      - name: Agendar Reels + Story
        run: cd video && python3 promo_post.py ../out
