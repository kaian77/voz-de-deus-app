# Fotos de produto (Studio → Loja → Fotos de produto): recorta cada produto das fotos do lote, separa prata/dourado
# e faz a foto de fundo branco e a do tema (cenário por IA grátis). O Studio dispara este workflow ao criar o lote.
name: Fotos de produto

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Refazer só algumas fotos de um lote: id do lote (vazio = fila normal)"
        required: false
      sources:
        description: "Números das fotos (0 = 1ª), separados por vírgula"
        required: false
      theme:
        description: "Tema do fundo para essas fotos (opcional)"
        required: false

concurrency:
  group: product-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem lote na fila?
        id: queue
        run: |
          if [[ -n "${{ inputs.job }}" ]]; then echo "status=queued" >> "$GITHUB_OUTPUT"
          else echo "status=$(python3 video/product_photos.py --check)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.status == 'queued'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt

      - name: Dependências
        if: steps.queue.outputs.status == 'queued'
        run: pip install -q -r video/requirements.txt

      - name: Modelo de recorte (cache)
        if: steps.queue.outputs.status == 'queued'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1

      - name: Processar fotos
        if: steps.queue.outputs.status == 'queued'
        env:
          JOB: ${{ inputs.job }}
          SOURCES: ${{ inputs.sources }}
          THEME: ${{ inputs.theme }}
        run: |
          if [[ -n "$JOB" ]]; then python3 video/product_photos.py --job "$JOB" --sources "$SOURCES" ${THEME:+--theme "$THEME"}
          else python3 video/product_photos.py; fi
