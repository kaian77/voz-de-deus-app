# Desafio da Bíblia (Facebook/Kwai, postado à mão): renderiza os episódios de video/quiz_episodes.json com a voz
# (video/quiz.py) e publica os vídeos + legendas + foto/capa da página na branch "desafio-da-biblia".
name: Desafio da Bíblia

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episódios (ex.: 1,2,3 ou all)"
        default: all

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "pillow>=10" "numpy>=1.26" "edge-tts>=7.0"

      - name: Renderizar
        run: |
          mkdir -p out
          cd video && python3 quiz.py --brand ../out/pagina && python3 quiz.py "${{ inputs.episodes }}" ../out

      - name: Publicar na branch desafio-da-biblia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin desafio-da-biblia && git checkout -q -b pub origin/desafio-da-biblia || git checkout -q --orphan pub
          git rm -rf --cached . -q || true
          find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git ! -name 'desafio-da-biblia-*' ! -name pagina -exec rm -rf {} +
          cp -r out/* . && rm -rf out
          git add -A
          git commit -qm "Desafio da Bíblia: episódios ${{ inputs.episodes }}"
          git push -q origin HEAD:desafio-da-biblia
