# Desafio da Bíblia (Facebook/Kwai, postado à mão): video/quiz_auto.py cria episódios novos com a IA (piloto do
# Studio: mantém alguns prontos e não postados) e renderiza os da fila com video/quiz.py; o vídeo vai para o storage e
# aparece em Studio → Desafio da Bíblia para baixar, com a legenda para copiar. O Studio dispara pelo botão; o
# horário abaixo repõe os episódios todo dia.
name: Desafio da Bíblia

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "pillow>=10" "numpy>=1.26" "edge-tts>=7.0"

      - name: Criar e renderizar
        run: cd video && python3 quiz_auto.py
