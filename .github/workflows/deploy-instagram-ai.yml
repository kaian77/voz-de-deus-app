name: Deploy Instagram AI function

on:
  push:
    branches: [paginaspro-instagram]
    paths:
      - "supabase/functions/ai/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-instagram-ai.yml"

concurrency:
  group: instagram-ai-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the AI function to the Instagram test project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing" >&2; exit 1; }
          supabase functions deploy ai --project-ref rnviynrlzolyzxfjviuk --use-api
