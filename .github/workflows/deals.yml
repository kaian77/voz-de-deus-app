# Achadinhos (Renda extra): todo dia escolhe produtos no feed da Shopee Afiliados e faz os vídeos com o link de
# afiliado do dono (video/deals.py). O dono baixa no Studio e posta pelo app da Shopee (não há API de postagem).
# O botão "Gerar mais" do Studio dispara este workflow (secret VIDEO_DISPATCH_TOKEN).
name: Achadinhos

on:
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * *" # 7h47 (Brasília)

concurrency:
  group: deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SHOPEE_FEED_OFICIAL: ${{ secrets.SHOPEE_FEED_OFICIAL }}
      SHOPEE_FEED_BR: ${{ secrets.SHOPEE_FEED_BR }}
      # ID de afiliado da Shopee (não é segredo: aparece em todo link de afiliado)
      SHOPEE_AFFILIATE_ID: ${{ vars.SHOPEE_AFFILIATE_ID || '18349840216' }}
      DEALS_COUNT: ${{ vars.DEALS_COUNT || '3' }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Configurado?
        id: check
        run: echo "status=$(cd video && python3 deals.py --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.status == 'go'
        with:
          python-version: "3.12"

      - name: Dependências
        if: steps.check.outputs.status == 'go'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "pillow>=10" "numpy>=1.26" "edge-tts>=7.0"
          mkdir -p ~/.fonts && cp video/engine/assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null

      - name: Escolher produtos e fazer os vídeos
        if: steps.check.outputs.status == 'go'
        run: cd video && python3 deals.py
