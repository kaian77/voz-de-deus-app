# Fotos temáticas dos produtos da loja (Produtos → Produtos da loja → "Foto temática"): fila store_photo_jobs →
# video/store_photos.py (fal.ai). O Studio dispara ao pôr na fila; 3 jobs em paralelo; se sobrar fila no fim, roda de novo.
name: Fotos temáticas da loja

on:
  workflow_dispatch:

concurrency:
  group: store-photos
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  photos:
    strategy:
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem lote na fila?
        id: queue
        run: echo "status=$(python3 video/store_photos.py --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.status == 'queued'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt

      - name: Dependências
        if: steps.queue.outputs.status == 'queued'
        run: pip install -q -r video/requirements.txt

      - name: Modelo de recorte (cache)
        if: steps.queue.outputs.status == 'queued'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1

      - name: Fazer as fotos temáticas
        if: steps.queue.outputs.status == 'queued'
        run: python3 video/store_photos.py

      - name: Sobrou fila? Roda de novo
        if: always() && strategy.job-index == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          if [[ "$(python3 video/store_photos.py --check)" == "queued" ]]; then gh workflow run store-photos.yml --ref main; fi
