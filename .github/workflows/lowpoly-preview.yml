# Amostra do estilo "3D low-poly explicativo" do StickWise (video/lowpoly.py + video/lowpoly/scene.html):
# narra em inglês, grava a cena three.js quadro a quadro e publica o MP4 + legenda na branch "lowpoly-preview".
name: Amostra 3D low-poly

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "pillow>=10" "numpy>=1.26" "edge-tts>=7.0"
          npm i --no-save --no-audit --no-fund three@0.169.0 playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Renderizar
        run: mkdir -p out && cd video && python3 lowpoly.py ../out/skyscraper-damper.mp4
      - name: Publicar na branch lowpoly-preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan lowpoly-tmp
          git rm -rf --cached . -q
          git add -f out/skyscraper-damper.mp4 out/skyscraper-damper.txt
          git commit -qm "Amostra: 3D low-poly (StickWise)"
          git push -fq origin HEAD:lowpoly-preview
