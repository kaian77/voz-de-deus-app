# Fotos dos anúncios do Mercado Livre (1200x1200, fundo branco, pin centralizado): processa a fila do Studio
# (tabela ml_photos). O Studio dispara este workflow quando enfileira fotos (secret VIDEO_DISPATCH_TOKEN);
# o horário abaixo é a rede de segurança. Com a fila vazia, termina em segundos (sem instalar nada).
name: Fotos do Mercado Livre

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"

concurrency:
  group: ml-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem foto na fila?
        id: queue
        run: echo "status=$(python3 video/ml_photos.py --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.status == 'queued'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: video/requirements.txt

      - name: Dependências
        if: steps.queue.outputs.status == 'queued'
        run: pip install -q -r video/requirements.txt

      - name: Modelo de recorte (cache)
        if: steps.queue.outputs.status == 'queued'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1

      - name: Processar fotos
        if: steps.queue.outputs.status == 'queued'
        run: python3 video/ml_photos.py
