# Vídeos do canal automático do YouTube (Renda extra): narra, anima, legenda, faz a capa e envia os vídeos com roteiro
# pronto (tabela yt_videos, status queued). O Studio dispara este workflow quando um roteiro fica pronto
# (VIDEO_DISPATCH_TOKEN); o horário abaixo é a rede de segurança. Com a fila vazia, termina em segundos.
name: Vídeos do YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *" # rede de segurança a cada 6 h (o roteiro pronto dispara na hora)

# Um de cada vez (o vídeo em andamento não é cancelado)
concurrency:
  group: youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME || 'supabase-citron-window' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Chaves do Supabase
        run: |
          set -euo pipefail
          api() { curl -sSf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1$1"; }
          REF=$(api /projects | jq -r --arg n "$SUPABASE_PROJECT_NAME" '.[] | select(.name == $n) | .id' | head -1)
          [[ -n $REF ]] || { echo "::error::Projeto $SUPABASE_PROJECT_NAME não encontrado"; exit 1; }
          KEY=$(api "/projects/$REF/api-keys?reveal=true" | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')
          [[ -n $KEY ]] || { echo "::error::Não consegui ler a chave de serviço do projeto"; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_KEY=$KEY" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Tem vídeo na fila?
        id: queue
        run: echo "status=$(cd video && python3 youtube.py --check)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.status == 'queued'
        with:
          python-version: "3.12"

      - name: Dependências
        if: steps.queue.outputs.status == 'queued'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "pillow>=10" "numpy>=1.26" "edge-tts>=7.0" "rembg[cpu]>=2.0.50"
          # Fonte das legendas visível para o libass
          mkdir -p ~/.fonts && cp video/engine/assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null

      - name: Modelo de recorte (cache)
        if: steps.queue.outputs.status == 'queued'
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-u2net-v2

      - name: Fazer e enviar os vídeos
        if: steps.queue.outputs.status == 'queued'
        run: cd video && python3 youtube.py
