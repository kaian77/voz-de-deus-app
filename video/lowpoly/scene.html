<!doctype html>
<!-- Estilo "3D low-poly explicativo" (StickWise): base comum (luz, céu, chão, cidade, árvores, bonequinho, setas,
     etiquetas, título e legenda palavra a palavra) + um tema por arquivo em topics/<nome>.js (?t=<nome>).
     render(t) é determinístico: o render.cjs grava quadro a quadro. Tema = { SHOTS, build(ctx), frame(ctx, t, i, k) }:
     SHOTS[i] = câmera da fala i [de, para, olha-de, olha-para]; frame devolve { html, svg, title } das etiquetas. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url(/video/engine/assets/fonts/Poppins-Bold.ttf); }
  @font-face { font-family: A; src: url(/video/engine/assets/fonts/Anton-Regular.woff); }
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #8fd0ff; }
  #c { position: absolute; inset: 0; width: 540px; height: 960px; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; transform: translate(-50%, -50%); background: #fff; color: #1d2433; font: 17px P;
          padding: 4px 11px 3px 9px; border-radius: 99px; letter-spacing: .5px; box-shadow: 0 2px 6px #0004;
          white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #e2463b; display: inline-block; }
  .pill.g i { background: #2bb673; }
  .pill.b i { background: #3b82f6; }
  #word { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font: 40px P; color: #fff;
          -webkit-text-stroke: 7px #111; paint-order: stroke fill; letter-spacing: .5px; }
  #title { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 52px A; color: #ffd23f;
           -webkit-text-stroke: 8px #1d1d1d; paint-order: stroke fill; line-height: 1.05; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg id="ov" viewBox="0 0 540 960"></svg>
<div id="labels"></div>
<div id="title"></div>
<div id="word"></div>
<script type="module">
import * as THREE from "three";

const W = 540, H = 960;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fd0ff");
scene.fog = new THREE.Fog("#bfe6ff", 120, 320);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 1500);

scene.add(new THREE.HemisphereLight("#eaf6ff", "#5b7a3a", 1.1));
const sun = new THREE.DirectionalLight("#fff3dd", 2.2);
sun.position.set(40, 90, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 90, bottom: -20, near: 1, far: 260 });
scene.add(sun);

// ---------------------------------------------------------------- peças comuns
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
const box = (w, h, d, m) => { const x = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); x.castShadow = x.receiveShadow = true; return x; };
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (a) => new THREE.Vector3(...a);
const pastel = ["#f2c14e", "#f78154", "#4d9de0", "#e15554", "#7768ae", "#3bb273", "#f4f1de", "#9ad1d4"];
function stripes(base, lines, n = 4, vertical = false) {
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 64;
  const g = cv.getContext("2d"); g.fillStyle = base; g.fillRect(0, 0, 64, 64);
  g.fillStyle = lines; const step = 64 / n;
  for (let y = step / 3; y < 64; y += step) vertical ? g.fillRect(y, 0, step / 2.3, 64) : g.fillRect(0, y, 64, step / 2.3);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
function ground(color = "#7cc35a") {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), mat(color));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g); return g;
}
function tree(x, z, s = 1, parent = scene) {
  const g = new THREE.Group();
  const tr = box(0.6 * s, 2 * s, 0.6 * s, mat("#7a5230")); tr.position.y = s; g.add(tr);
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8 * s, 0), mat(rnd() < 0.5 ? "#2f9e44" : "#3fae52")); top.position.y = 3 * s; top.castShadow = true; g.add(top);
  g.position.set(x, 0, z); parent.add(g); return g;
}
const clouds = [];
function sky(n = 14, y0 = 75, spread = 300) {
  for (let i = 0; i < n; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + rnd() * 3, 0), mat("#ffffff")); s.position.set(k * 4 - 6, rnd() * 2, rnd() * 3); c.add(s); }
    c.position.set(-spread / 2 + rnd() * spread, y0 + rnd() * 40, -140 + rnd() * 120); c.userData.x0 = c.position.x; scene.add(c); clouds.push(c);
  }
}
function city(n = 46, rMin = 28, rMax = 118, avoid = () => false) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, r = rMin + rnd() * (rMax - rMin);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (avoid(x, z)) continue;
    const h = 4 + rnd() * (r < 60 ? 22 : 12), w = 6 + rnd() * 6, d = 6 + rnd() * 6;
    const tex = stripes(pastel[i % pastel.length], "#ffffff55"); tex.repeat.set(1, Math.round(h / 4));
    const b = box(w, h, d, new THREE.MeshLambertMaterial({ map: tex, flatShading: true })); b.position.set(x, h / 2, z); scene.add(b);
    const roof = box(w + 0.4, 0.6, d + 0.4, mat("#3c3f46")); roof.position.set(x, h + 0.3, z); scene.add(roof);
  }
}
function person(x, z, ry, color = "#f2c14e", parent = scene) {
  const g = new THREE.Group();
  const legs = box(0.5, 1, 0.3, mat("#2c4f86")); legs.position.y = 0.5; g.add(legs);
  const body = box(0.7, 1, 0.4, mat(color)); body.position.y = 1.5; g.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.33, 1), mat("#f1c27d")); head.position.y = 2.3; g.add(head);
  const hat = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), mat("#ffd23f")); hat.position.y = 2.42; g.add(hat);
  const arm = box(0.2, 0.9, 0.2, mat(color)); arm.position.set(0.45, 1.9, 0); arm.rotation.z = -2.5; g.add(arm);
  g.position.set(x, 0.3, z); g.rotation.y = ry; g.scale.setScalar(1.6); parent.add(g); return g;
}
function arrow(color, len = 3.4, thick = 0.22) {
  const g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthTest: false });
  const s = new THREE.Mesh(new THREE.CylinderGeometry(thick, thick, len, 8), m); s.rotation.z = Math.PI / 2; g.add(s);
  const h = new THREE.Mesh(new THREE.ConeGeometry(thick * 2.7, thick * 6.4, 10), m); h.rotation.z = -Math.PI / 2; h.position.x = len / 2 + thick * 3; g.add(h);
  g.renderOrder = 10; g.children.forEach((c) => (c.renderOrder = 10));
  g.userData.m = m; scene.add(g); return g;
}
function proj(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z < 1]; }
function world(obj, local = new THREE.Vector3()) { return obj.localToWorld(local.clone()); }
function pill(text, v, opacity = 1, kind = "") {
  const [x, y, ok] = proj(v); if (!ok || opacity <= 0.01) return "";
  return `<div class="pill ${kind}" style="left:${x}px;top:${y}px;opacity:${opacity}"><i></i>${text}</div>`;
}
const ctx = { THREE, scene, camera, renderer, sun, rnd, mat, box, ease, lerp, V, pastel, stripes, ground, tree, sky, city, person, arrow, proj, world, pill, W, H };

// ---------------------------------------------------------------- tema
const name = new URLSearchParams(location.search).get("t") || "damper";
const T = await import(`./topics/${name}.js`);
T.build(ctx);

window.TL = null;
window.setTL = (tl) => { window.TL = tl; window.END = tl.total; };
function shotAt(t) {
  const L = window.TL.lines;
  for (let i = L.length - 1; i >= 0; i--) if (t >= (i ? L[i].start - 0.2 : 0)) {
    const st = i ? L[i].start - 0.2 : 0, end = i + 1 < L.length ? L[i + 1].start - 0.2 : window.TL.total;
    return { i, k: (t - st) / (end - st) };
  }
  return { i: 0, k: 0 };
}
const labels = document.getElementById("labels"), ov = document.getElementById("ov");
const word = document.getElementById("word"), title = document.getElementById("title");

window.render = (t) => {
  const { i, k } = shotAt(t);
  const S = T.SHOTS[Math.min(i, T.SHOTS.length - 1)], e = ease(k);
  camera.position.copy(V(S[0]).lerp(V(S[1]), e));
  camera.lookAt(V(S[2]).lerp(V(S[3]), e));
  camera.updateMatrixWorld();
  clouds.forEach((c, n) => { c.position.x = c.userData.x0 + t * (1.5 + n % 3); });
  const pre = T.frame(ctx, t, i, k, window.TL) || {};
  scene.updateMatrixWorld();
  renderer.render(scene, camera);
  const out = T.labels ? T.labels(ctx, t, i, k, window.TL) : pre;
  labels.innerHTML = out.html || ""; ov.innerHTML = out.svg || "";
  title.innerHTML = out.title ? `<span style="opacity:${out.titleOpacity ?? 1}">${out.title}</span>` : "";
  let w = "";
  for (const ln of window.TL.lines) {
    if (t < ln.start - 0.05 || t > ln.end + 0.25) continue;
    for (let n = 0; n < ln.words.length; n++) {
      const x = ln.words[n], nx = ln.words[n + 1];
      if (t >= x.t - 0.05 && (!nx || t < nx.t - 0.05)) w = x.w;
    }
  }
  word.textContent = w.replace(/[.,!?;:]+$/, "");
};
await document.fonts.ready;
window.ready = true;
</script>
</body>
</html>
