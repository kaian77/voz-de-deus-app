<!doctype html>
<!-- Estilo "3D low-poly explicativo" (StickWise): cena em three.js desenhada por código, câmera por tomada,
     corte por dentro, etiquetas e legenda palavra a palavra. render(t) é determinístico: o render.cjs grava quadro
     a quadro. Amostra: por que arranha-céu não cai com o vento (amortecedor de massa). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url(/video/engine/assets/fonts/Poppins-Bold.ttf); }
  @font-face { font-family: A; src: url(/video/engine/assets/fonts/Anton-Regular.woff); }
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #8fd0ff; }
  #c { position: absolute; inset: 0; width: 540px; height: 960px; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .pill { position: absolute; transform: translate(-50%, -50%); background: #fff; color: #1d2433; font: 17px P;
          padding: 4px 10px 3px 8px; border-radius: 99px; letter-spacing: .5px; box-shadow: 0 2px 6px #0004;
          white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: #e2463b; display: inline-block; }
  .pill.g i { background: #2bb673; }
  #word { position: absolute; left: 0; right: 0; top: 590px; text-align: center; font: 40px P; color: #fff;
          -webkit-text-stroke: 7px #111; paint-order: stroke fill; letter-spacing: .5px; }
  #title { position: absolute; left: 0; right: 0; top: 230px; text-align: center; font: 52px A; color: #ffd23f;
           -webkit-text-stroke: 8px #1d1d1d; paint-order: stroke fill; line-height: 1.05; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<svg id="ov" viewBox="0 0 540 960"></svg>
<div id="labels"></div>
<div id="title"></div>
<div id="word"></div>
<script type="module">
import * as THREE from "three";

// ---------------------------------------------------------------- base
const W = 540, H = 960;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fd0ff");
scene.fog = new THREE.Fog("#bfe6ff", 120, 320);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 800);

scene.add(new THREE.HemisphereLight("#eaf6ff", "#5b7a3a", 1.1));
const sun = new THREE.DirectionalLight("#fff3dd", 2.2);
sun.position.set(40, 90, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 90, bottom: -20, near: 1, far: 260 });
scene.add(sun);

// gerador fixo: a cena sai igual em todo quadro
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
const box = (w, h, d, m) => { const x = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); x.castShadow = x.receiveShadow = true; return x; };

// ---------------------------------------------------------------- chão e cidade
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), mat("#7cc35a"));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const road = mat("#5d6168"), walk = mat("#d9d4c8");
for (const [x, z, w, d] of [[0, 16, 400, 7], [16, 0, 7, 400], [-30, -40, 7, 400], [0, -45, 400, 7]]) {
  const r = box(w, 0.1, d, road); r.position.set(x, 0.05, z); scene.add(r);
}
const plaza = box(22, 0.3, 22, walk); plaza.position.set(0, 0.15, 0); scene.add(plaza);
const pastel = ["#f2c14e", "#f78154", "#4d9de0", "#e15554", "#7768ae", "#3bb273", "#f4f1de", "#9ad1d4"];
function windowsTex(base, lines) {
  const cv = document.createElement("canvas"); cv.width = 64; cv.height = 64;
  const g = cv.getContext("2d"); g.fillStyle = base; g.fillRect(0, 0, 64, 64);
  g.fillStyle = lines; for (let y = 6; y < 64; y += 16) g.fillRect(0, y, 64, 7);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
for (let i = 0; i < 46; i++) {
  const a = rnd() * Math.PI * 2, r = 28 + rnd() * 90;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(z - 16) < 8 || Math.abs(x - 16) < 8 || Math.abs(x + 30) < 8 || Math.abs(z + 45) < 8) continue;
  const h = 4 + rnd() * (r < 60 ? 22 : 12), w = 6 + rnd() * 6, d = 6 + rnd() * 6;
  const tex = windowsTex(pastel[i % pastel.length], "#ffffff55"); tex.repeat.set(1, Math.round(h / 4));
  const b = box(w, h, d, new THREE.MeshLambertMaterial({ map: tex, flatShading: true }));
  b.position.set(x, h / 2, z); scene.add(b);
  const roof = box(w + 0.4, 0.6, d + 0.4, mat("#3c3f46")); roof.position.set(x, h + 0.3, z); scene.add(roof);
}
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  const tr = box(0.6 * s, 2 * s, 0.6 * s, mat("#7a5230")); tr.position.y = s; g.add(tr);
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(1.8 * s, 0), mat("#2f9e44")); top.position.y = 3 * s; top.castShadow = true; g.add(top);
  g.position.set(x, 0, z); scene.add(g);
}
for (let i = 0; i < 40; i++) { const x = -60 + rnd() * 120, z = 20 + rnd() * 60; if (Math.abs(z - 16) > 5 && Math.abs(x - 16) > 5) tree(x, z, 0.8 + rnd() * 0.6); }
for (const [x, z] of [[-9, 9], [9, 9], [-9, -9], [9, -9]]) tree(x, z, 1);
const clouds = [];
for (let i = 0; i < 14; i++) {
  const c = new THREE.Group();
  for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + rnd() * 3, 0), mat("#ffffff")); s.position.set(k * 4 - 6, rnd() * 2, rnd() * 3); c.add(s); }
  c.position.set(-150 + rnd() * 300, 75 + rnd() * 40, -140 + rnd() * 120); scene.add(c); clouds.push(c);
}

// ---------------------------------------------------------------- a torre (gira na base = balanço)
const tower = new THREE.Group(); scene.add(tower);
const glass = windowsTex("#5aa9e6", "#cfeaff");
function part(w, h, y, rep) {
  const t = glass.clone(); t.needsUpdate = true; t.repeat.set(2, rep);
  const m = box(w, h, w, new THREE.MeshLambertMaterial({ map: t, flatShading: true })); m.position.y = y + h / 2; tower.add(m);
  const band = box(w + 0.5, 0.6, w + 0.5, mat("#e9eef3")); band.position.y = y + h; tower.add(band);
}
part(10, 18, 0, 6); part(9, 16, 18, 5); part(8, 14, 34, 5);
// sala do amortecedor (oca): chão, teto, colunas e 4 paredes; a da frente some no corte
const ROOM_Y = 48, ROOM_H = 12, RW = 8;
const roomFloor = box(RW, 0.6, RW, mat("#c9ced6")); roomFloor.position.y = ROOM_Y; tower.add(roomFloor);
const roomRoof = box(RW + 0.5, 0.8, RW + 0.5, mat("#e9eef3")); roomRoof.position.y = ROOM_Y + ROOM_H; tower.add(roomRoof);
const inner = mat("#d9dde3", { side: THREE.DoubleSide });
const walls = [];
for (const [x, z, ry] of [[0, -RW / 2, 0], [-RW / 2, 0, Math.PI / 2], [RW / 2, 0, Math.PI / 2], [0, RW / 2, 0]]) {
  const t = glass.clone(); t.needsUpdate = true; t.repeat.set(2, 4);
  const m = new THREE.Mesh(new THREE.BoxGeometry(RW, ROOM_H, 0.3), new THREE.MeshLambertMaterial({ map: t, flatShading: true, transparent: true }));
  m.position.set(x, ROOM_Y + ROOM_H / 2, z); m.rotation.y = ry; m.castShadow = true; tower.add(m); walls.push(m);
}
const front = walls[3];
const lamp = new THREE.PointLight("#fff2d6", 60, 18); lamp.position.set(0, ROOM_Y + ROOM_H - 1.5, 2); tower.add(lamp);
const frontEdges = new THREE.LineSegments(new THREE.EdgesGeometry(front.geometry), new THREE.LineBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0 }));
frontEdges.position.copy(front.position); tower.add(frontEdges);
// topo e antena
part(6.5, 6, ROOM_Y + ROOM_H, 2);
const spire = new THREE.Mesh(new THREE.ConeGeometry(0.6, 10, 6), mat("#d0d6de")); spire.position.y = ROOM_Y + ROOM_H + 6 + 5; spire.castShadow = true; tower.add(spire);
const TOP = ROOM_Y + ROOM_H + 16;

// pêndulo: bola de aço presa por cabos no teto da sala
const pend = new THREE.Group(); pend.position.y = ROOM_Y + ROOM_H - 0.4; tower.add(pend);
const BALL_R = 2.1, L = 7.2;
const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(BALL_R, 1), new THREE.MeshStandardMaterial({ color: "#f2b632", metalness: 0.6, roughness: 0.35, flatShading: true }));
ball.position.y = -L; ball.castShadow = true; pend.add(ball);
const cableM = mat("#2d3138");
for (const [x, z] of [[-1.2, -1.2], [1.2, -1.2], [-1.2, 1.2], [1.2, 1.2]]) {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, L - BALL_R + 0.4, 6), cableM);
  c.position.set(x * 0.6, -(L - BALL_R) / 2, z * 0.6); pend.add(c);
}
// pistões embaixo da bola (amortecem)
for (const a of [0, 1, 2, 3]) {
  const p = box(0.35, 2.4, 0.35, mat("#8a929c")); const ang = a * Math.PI / 2 + Math.PI / 4;
  p.position.set(Math.cos(ang) * 2.4, ROOM_Y + 1.4, Math.sin(ang) * 2.4); p.rotation.z = Math.cos(ang) * 0.3; p.rotation.x = -Math.sin(ang) * 0.3; tower.add(p);
}

// ---------------------------------------------------------------- vento, setas, bonequinho
const wind = [];
const windM = new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0 });
for (let i = 0; i < 34; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(4 + rnd() * 6, 0.12, 0.12), windM);
  m.userData = { y: 30 + rnd() * 40, z: -10 + rnd() * 26, o: rnd() * 60, v: 26 + rnd() * 14 };
  scene.add(m); wind.push(m);
}
function arrow(color) {
  const g = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 });
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3.4, 8), m); s.rotation.z = Math.PI / 2; g.add(s);
  const h = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.4, 10), m); h.rotation.z = -Math.PI / 2; h.position.x = 2.3; g.add(h);
  g.userData.m = m; return g;
}
const redArrow = arrow("#e2463b"); scene.add(redArrow);
const greenArrow = arrow("#2bb673"); scene.add(greenArrow);
function person(x, z, ry) {
  const g = new THREE.Group();
  const legs = box(0.5, 1, 0.3, mat("#2c4f86")); legs.position.y = 0.5; g.add(legs);
  const body = box(0.7, 1, 0.4, mat("#f2c14e")); body.position.y = 1.5; g.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.33, 1), mat("#f1c27d")); head.position.y = 2.3; g.add(head);
  const hat = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), mat("#ffd23f")); hat.position.y = 2.42; g.add(hat);
  const arm = box(0.2, 0.9, 0.2, mat("#f2c14e")); arm.position.set(0.45, 1.9, 0); arm.rotation.z = -2.5; g.add(arm);
  g.position.set(x, 0.3, z); g.rotation.y = ry; g.scale.setScalar(1.6); scene.add(g); return g;
}
person(4, 9, 0.5);
person(-3, 10, -0.4);

// ---------------------------------------------------------------- linha do tempo
// TL.lines[i] = { start, end, words: [{t, d, w}] } (t em segundos do vídeo). Tomada i = fala i.
window.TL = null;
window.setTL = (tl) => { window.TL = tl; window.END = tl.total; };
const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
const V = (a) => new THREE.Vector3(...a);
// câmera de cada tomada: [de, para, olha-de, olha-para]
const SHOTS = [
  [[50, 6, 70], [42, 12, 60], [0, 34, 0], [0, 38, 0]],
  [[30, 50, 46], [24, 58, 38], [0, 54, 0], [0, 56, 0]],
  [[18, 60, 30], [15, 58, 25], [0, 56, 0], [0, 55, 0]],
  [[0, 55, 36], [0, 54, 24], [0, 54, 0], [0, 54, 0]],
  [[-10, 56, 20], [9, 53.5, 19], [0, 53, 0], [0, 52.5, 0]],
  [[0, 54.5, 28], [0, 55, 26], [0, 53.5, 0], [0, 53.5, 0]],
  [[9, 52, 22], [34, 32, 54], [0, 52, 0], [0, 40, 0]],
  [[38, 18, 48], [42, 22, 54], [0, 32, 0], [0, 34, 0]],
];
function shotAt(t) {
  const L = window.TL.lines;
  for (let i = L.length - 1; i >= 0; i--) if (t >= (i ? L[i].start - 0.2 : 0)) {
    const end = i + 1 < L.length ? L[i + 1].start - 0.2 : window.TL.total;
    const st = i ? L[i].start - 0.2 : 0;
    return { i, k: (t - st) / (end - st), st, end };
  }
  return { i: 0, k: 0, st: 0, end: 1 };
}
const SW = 2 * Math.PI * 0.55; // ~0,55 balanço por segundo
function swayAmp(t) {
  const L = window.TL.lines, s = (i) => (L[i] ? L[i].start : 1e9);
  let a = 0.012;
  if (t > s(1) - 0.2) a = 0.03;
  if (t > s(2) - 0.2) a = 0.05;
  if (t > s(3) - 0.2) a = 0.032;
  if (t > s(6) - 0.2) a = lerp(0.032, 0.006, ease((t - s(6)) / 2.5));
  return a;
}

// ---------------------------------------------------------------- etiquetas (HTML/SVG por cima)
const labels = document.getElementById("labels"), ov = document.getElementById("ov");
const word = document.getElementById("word"), title = document.getElementById("title");
function proj(v) { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z < 1]; }
function world(obj, local) { return obj.localToWorld(local.clone()); }
function pill(text, v, opacity = 1, green = false) {
  const [x, y, ok] = proj(v); if (!ok || opacity <= 0) return "";
  return `<div class="pill${green ? " g" : ""}" style="left:${x}px;top:${y}px;opacity:${opacity}"><i></i>${text}</div>`;
}

// ---------------------------------------------------------------- quadro
window.render = (t) => {
  const { i, k } = shotAt(t);
  const S = SHOTS[Math.min(i, SHOTS.length - 1)], e = ease(k);
  camera.position.copy(V(S[0]).lerp(V(S[1]), e));
  camera.lookAt(V(S[2]).lerp(V(S[3]), e));

  const amp = swayAmp(t), sway = Math.sin(t * SW) * amp;
  tower.rotation.z = sway;
  // a bola balança ao contrário da torre (mais forte depois que aparece)
  pend.rotation.z = -Math.sin(t * SW) * (i >= 4 ? 0.22 : 0.12) * (amp / 0.032);
  clouds.forEach((c, n) => { c.position.x = ((c.userData.x0 ??= c.position.x) + t * (1.5 + n % 3)) ; });

  // corte: a parede da frente some na tomada 3 e fica aberta
  const cut = i < 3 ? 0 : i === 3 ? ease((k - 0.25) / 0.5) : 1;
  front.material.opacity = 1 - cut * 0.92;
  front.visible = cut < 0.98;
  frontEdges.material.opacity = cut * 0.9;

  const windOn = i === 1 || i === 2 || i === 5 ? 0.75 : i === 6 ? 0.75 * (1 - ease(k * 2)) : 0;
  windM.opacity = windOn;
  wind.forEach((m) => { const u = m.userData; m.position.set(((u.o + t * u.v) % 70) - 40, u.y, u.z); });

  // setas: vento empurra a torre (vermelha), bola vai ao contrário (verde)
  const arr = i === 5 ? ease(k * 3) : 0, dir = Math.sign(Math.cos(t * SW)) || 1;
  redArrow.userData.m.opacity = greenArrow.userData.m.opacity = arr;
  redArrow.position.set(-RW / 2 - 2.2 + Math.sin(t * SW) * 0.3, ROOM_Y + 2.2, RW / 2 + 1);
  redArrow.rotation.z = 0;
  const bw = world(ball, new THREE.Vector3());
  greenArrow.position.set(bw.x + 3.4, bw.y + 3.3, bw.z + 2.4);
  greenArrow.rotation.z = Math.PI;
  void dir;

  renderer.render(scene, camera);

  // ----- etiquetas
  let html = "", svg = "";
  if (i === 0) {
    const a = proj(new THREE.Vector3(9, 0.3, 6)), b = proj(world(tower, new THREE.Vector3(0, TOP, 0)).setX(9).setZ(6));
    const o = ease((k - 0.15) * 4);
    svg += `<g opacity="${o}" stroke="#fff" stroke-width="2.5"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>` +
      `<line x1="${a[0] - 8}" y1="${a[1]}" x2="${a[0] + 8}" y2="${a[1]}"/><line x1="${b[0] - 8}" y1="${b[1]}" x2="${b[0] + 8}" y2="${b[1]}"/></g>`;
    html += pill("500+ m", new THREE.Vector3(9, TOP * 0.55, 6), o, true);
  }
  if (i === 1) html += pill("WIND", new THREE.Vector3(-14, 60, 8), ease((k - 0.2) * 4));
  if (i === 2) {
    const tp = proj(world(tower, new THREE.Vector3(0, TOP - 4, 0))), o = ease((k - 0.15) * 4);
    svg += `<g opacity="${o}" stroke="#fff" stroke-width="3" fill="#fff"><line x1="${tp[0] - 70}" y1="${tp[1] - 40}" x2="${tp[0] + 70}" y2="${tp[1] - 40}"/>` +
      `<path d="M${tp[0] - 78} ${tp[1] - 40} l12 -7 v14z"/><path d="M${tp[0] + 78} ${tp[1] - 40} l-12 -7 v14z"/></g>`;
    html += pill("SWAY", world(tower, new THREE.Vector3(0, TOP - 1, 0)), o);
  }
  if (i === 4) {
    html += pill("660 TONS", world(ball, new THREE.Vector3(0, -BALL_R - 0.8, 2)), ease((k - 0.25) * 4), true);
    html += pill("STEEL CABLES", world(pend, new THREE.Vector3(1.6, -2.2, 1)), ease((k - 0.55) * 4));
  }
  if (i === 5) {
    html += pill("WIND", redArrow.position.clone().add(new THREE.Vector3(2.2, 1.6, 0)), arr);
    html += pill("BALL", greenArrow.position.clone().add(new THREE.Vector3(-0.6, 1.5, 0)), arr, true);
  }
  labels.innerHTML = html; ov.innerHTML = svg;
  title.innerHTML = i === 7 ? `<span style="opacity:${ease(k * 4)}">TUNED MASS<br>DAMPER</span>` : "";

  // ----- legenda: a palavra falada agora
  let w = "";
  for (const ln of window.TL.lines) {
    if (t < ln.start - 0.05 || t > ln.end + 0.25) continue;
    for (let n = 0; n < ln.words.length; n++) {
      const x = ln.words[n], nx = ln.words[n + 1];
      if (t >= x.t - 0.05 && (!nx || t < nx.t - 0.05)) w = x.w;
    }
  }
  word.textContent = w.replace(/[.,!?;:]+$/, "");
};
await document.fonts.ready;
window.ready = true;
</script>
</body>
</html>
